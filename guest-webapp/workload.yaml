apiVersion: openchoreo.dev/v1alpha1
metadata:
  name: guest-webapp

endpoints:
  - name: http
    type: HTTP
    port: 9090
    basePath: /
    visibility:
      - project
      - external

dependencies:
  endpoints:
    - component: simplest-crud-office-office-api
      name: http
      visibility: project
      envBindings:
        address: OFFICE_API_URL
  resources:
    - ref: simplest-crud-off-db79328f
      envBindings:
        client_id: USER_AUTH_CLIENT_ID
        issuer: USER_AUTH_ISSUER
        jwks_url: USER_AUTH_JWKS_URL
        resource: USER_AUTH_RESOURCE
        scopes: USER_AUTH_SCOPES
